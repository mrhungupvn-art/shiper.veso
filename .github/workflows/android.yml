name: Android Shipper Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub-hosted Ubuntu runners already provide the Android SDK.
      # No release keystore or KEYSTORE_* secrets are required for debug APKs.
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          test -d "$ANDROID_HOME" || { echo "Android SDK not found at $ANDROID_HOME"; exit 1; }
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "Android SDK platform 35 is not installed on this runner."
            exit 1
          }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || {
            echo "Android build-tools 35.0.0 are not installed on this runner."
            exit 1
          }
          echo "Android SDK platform 35 and build-tools 35.0.0 are ready."

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || {
            echo "ERROR: Debug APK was not generated: $APK"
            find app/build/outputs/apk -maxdepth 3 -type f -print || true
            exit 1
          }
          echo "Debug APK ready: $APK"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: com11h-shipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
