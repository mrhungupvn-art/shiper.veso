name: Create COM11H Shipper Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Missing KEYSTORE_PASSWORD"
            exit 1
          fi

          keytool -genkeypair -v             -keystore com11h-release.keystore             -storetype JKS             -alias com11h_shipper             -keyalg RSA             -keysize 2048             -validity 10000             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEYSTORE_PASSWORD"             -dname "CN=COM11H Shipper, OU=COM11H, O=COM11H, L=Vietnam, ST=Vietnam, C=VN"

      - name: Convert keystore to Base64
        run: |
          set -e
          base64 -w 0 com11h-release.keystore > com11h-release.keystore.base64
          echo "Keystore created successfully."
          echo "Base64 file size:"
          wc -c < com11h-release.keystore.base64

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: com11h-keystore
          path: |
            com11h-release.keystore
            com11h-release.keystore.base64
          retention-days: 1
